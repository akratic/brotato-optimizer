name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache built weapon/eHP data
        id: cache-data
        uses: actions/cache@v4
        with:
          path: |
            site/public/data
            site/public/icons
          key: dps-data-${{ hashFiles('weapons.csv', 'dps_optimizer.py', 'ehp_optimizer.py', 'build_site_data.py', 'icons/**') }}

      - name: Build weapon/eHP data
        if: steps.cache-data.outputs.cache-hit != 'true'
        run: python3 build_site_data.py --n 100

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install site dependencies
        working-directory: site
        run: npm ci

      - name: Build site
        working-directory: site
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
